# docker-compose.dev.yml
# Development override: live-reload for backend and frontend via bind mounts.
#
# Usage:
#   docker-compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  backend:
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
      - ./storage:/app/storage
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-clipcreator}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-clipcreator}
      # Overrides the base .env's FRONTEND_ORIGIN (http://localhost, for the
      # nginx-served build) — the dev frontend runs on Vite's dev server port.
      FRONTEND_ORIGIN: http://localhost:5173
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: build
    command: ["npm", "run", "dev", "--", "--host"]
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports:
      - "5173:5173"
