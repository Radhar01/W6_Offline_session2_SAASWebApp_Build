# docker-compose.yml
# Production-oriented base stack for ClipCreator: postgres + backend (FastAPI/ffmpeg) + frontend (nginx).

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-clipcreator}
      POSTGRES_USER: ${POSTGRES_USER:-clipcreator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-clipcreator}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # yt-dlp PO-token provider: generates the "proof of origin" token YouTube
  # requires from datacenter/VPS IPs (avoids the "Sign in to confirm you're
  # not a bot" block). Internal only -- yt-dlp reaches it over the compose
  # network. https://github.com/Brainicism/bgutil-ytdlp-pot-provider
  bgutil-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    restart: unless-stopped
    init: true

  # Persistent headless Chromium (LinuxServer's KasmVNC-based image), logged
  # into YouTube once via its web-based remote desktop. yt-dlp then reads
  # cookies live from this profile on every request instead of a frozen
  # cookies.txt snapshot, so it keeps working as the session naturally
  # refreshes itself -- exactly like staying logged into Gmail for months.
  # The web UI is loopback-only; reach it via an SSH tunnel, never expose
  # it publicly (it holds an authenticated Google session).
  youtube-cookies:
    image: lscr.io/linuxserver/chromium:latest
    restart: unless-stopped
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Etc/UTC
    shm_size: "1gb"
    volumes:
      - youtube_cookies_profile:/config
    ports:
      - "127.0.0.1:3005:3000"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-clipcreator}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-clipcreator}
      MEDIA_STORAGE_PATH: /app/storage
      BGUTIL_PROVIDER_URL: http://bgutil-provider:4416
      YTDLP_COOKIES_PROFILE_PATH: /app/chromium_profile
    depends_on:
      postgres:
        condition: service_healthy
      bgutil-provider:
        condition: service_started
    volumes:
      - ./storage:/app/storage
      - youtube_cookies_profile:/app/chromium_profile:ro
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
  youtube_cookies_profile:
