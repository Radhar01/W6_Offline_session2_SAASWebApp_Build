# frontend/nginx.conf
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Allow large video uploads to pass through to the backend proxy.
    client_max_body_size 2048M;

    # Docker's embedded DNS -- re-resolve "backend" per request (short TTL)
    # instead of caching its IP for nginx's whole lifetime. Without this,
    # redeploying the backend container independently (which gets a new
    # internal IP) leaves the frontend serving 502s until it's restarted
    # too, since a plain `proxy_pass http://backend:8000` only resolves
    # the hostname once, at config load time.
    resolver 127.0.0.11 valid=10s;

    # SPA routing: fall back to index.html for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the backend service (see docker-compose.yml).
    location /api {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Proxy media (clip thumbnails) to the backend's static-files mount.
    location /media {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
